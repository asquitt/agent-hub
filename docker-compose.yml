services:
  api:
    build: .
    container_name: agenthub-api
    init: true
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      AGENTHUB_ACCESS_POLICY_MODE: "${AGENTHUB_ACCESS_POLICY_MODE:-enforce}"
      AGENTHUB_API_KEYS_JSON: "${AGENTHUB_API_KEYS_JSON:?AGENTHUB_API_KEYS_JSON is required}"
      AGENTHUB_AUTH_TOKEN_SECRET: "${AGENTHUB_AUTH_TOKEN_SECRET:?AGENTHUB_AUTH_TOKEN_SECRET is required}"
      AGENTHUB_IDENTITY_SIGNING_SECRET: "${AGENTHUB_IDENTITY_SIGNING_SECRET:?AGENTHUB_IDENTITY_SIGNING_SECRET is required}"
      AGENTHUB_FEDERATION_DOMAIN_TOKENS_JSON: "${AGENTHUB_FEDERATION_DOMAIN_TOKENS_JSON:?AGENTHUB_FEDERATION_DOMAIN_TOKENS_JSON is required}"
      AGENTHUB_PROVENANCE_SIGNING_SECRET: "${AGENTHUB_PROVENANCE_SIGNING_SECRET:?AGENTHUB_PROVENANCE_SIGNING_SECRET is required}"
      AGENTHUB_POLICY_SIGNING_SECRET: "${AGENTHUB_POLICY_SIGNING_SECRET:?AGENTHUB_POLICY_SIGNING_SECRET is required}"
      AGENTHUB_VAULT_KEY: "${AGENTHUB_VAULT_KEY:?AGENTHUB_VAULT_KEY is required}"
    volumes:
      - agenthub_data:/app/data
    deploy:
      replicas: 1
    restart: unless-stopped
    stop_grace_period: 35s

volumes:
  agenthub_data:

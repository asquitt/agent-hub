name: Quality Gates

# CI is manual pending billing restoration.
on:
  workflow_dispatch:

jobs:
  pytest-full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AGENTHUB_ACCESS_ENFORCEMENT_MODE: enforce
      AGENTHUB_API_KEYS_JSON: '{"dev-owner-key":"owner-dev","partner-owner-key":"owner-partner","platform-owner-key":"owner-platform","test-key":"owner-dev","test-key-001":"test-owner"}'
      AGENTHUB_AUTH_TOKEN_SECRET: ci-test-auth-secret
      AGENTHUB_FEDERATION_DOMAIN_TOKENS_JSON: '{"partner-east":"ci-fed-token-east","partner-west":"ci-fed-token-west","test-domain":"ci-test-token","test.local":"ci-local-token"}'
      AGENTHUB_IDENTITY_SIGNING_SECRET: ci-test-identity-secret
      AGENTHUB_POLICY_SIGNING_SECRET: ci-test-policy-secret
      AGENTHUB_PROVENANCE_SIGNING_SECRET: ci-test-provenance-secret
      AGENTHUB_VAULT_KEY: ci-test-vault-key
      PYTHONHASHSEED: "0"
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Startup preflight doctor
        run: python -m agenthub.cli doctor --local --json

      - name: Verify deterministic test collection
        run: python -m pytest --collect-only -q

      - name: Run full Python test suite
        run: python -m pytest -q

      - name: Dependency vulnerability scan
        run: |
          python -m pip install pip-audit
          python -m pip_audit --strict --requirement requirements.txt

  playwright-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore

  quality-gates:
    if: always()
    needs:
      - pytest-full
      - playwright-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required upstream checks
        run: |
          echo "pytest-full: ${{ needs.pytest-full.result }}"
          echo "playwright-e2e: ${{ needs.playwright-e2e.result }}"
          if [ "${{ needs.pytest-full.result }}" != "success" ] || [ "${{ needs.playwright-e2e.result }}" != "success" ]; then
            exit 1
          fi
